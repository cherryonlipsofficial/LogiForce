services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - PLATFORM_MONGODB_URI=${PLATFORM_MONGODB_URI:-mongodb://mongo:27017}
      - MONGODB_BASE_URI=${MONGODB_BASE_URI:-mongodb://mongo:27017}
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - PLATFORM_DB_NAME=${PLATFORM_DB_NAME:-logiforce_platform}
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - PLATFORM_JWT_SECRET=${PLATFORM_JWT_SECRET:?PLATFORM_JWT_SECRET must be set (32+ characters, different from JWT_SECRET)}
      - PLATFORM_JWT_EXPIRES_IN=${PLATFORM_JWT_EXPIRES_IN:-8h}
      - NODE_ENV=${NODE_ENV:-production}
      - CLIENT_URL=${CLIENT_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-LogiForce <onboarding@resend.dev>}
      - EMAIL_DEV_LOG=${EMAIL_DEV_LOG:-false}

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
        - VITE_APP_DOMAIN=${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
